<!doctype html><html lang="en"><meta charset="utf-8"><title>Companion motion proof</title><style>body{margin:0;background:#fffdfa;font:18px system-ui}.row{display:flex;gap:18px;padding:22px}.slot{width:250px;height:390px;background:#fff2df}.label{text-align:center}h1{font-size:25px;margin:25px}button{font:inherit}</style><h1>Articulated Mina / Alex / Jo</h1><div id="proof"></div><script type="module">import{mountCompanion}from'../src/companion-rig.js';const m=await fetch('../assets/art/manifest.json').then(r=>r.json());window.rigs=[];for(const char of['mina','alex','jo']){const row=document.createElement('div');row.className='row';for(const mood of['idle','wave','celebrate']){const item=document.createElement('div');item.innerHTML=`<div class="slot"></div><div class="label">${char} · ${mood}</div>`;row.append(item);document.getElementById('proof').append(row);const rig=mountCompanion(item.firstChild,{character:char,mood,manifest:m});window.rigs.push(rig);}}</script></html>
