<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizons A1 — Student's Book</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #ececec;
    }

    #hz-book {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 230mm;
      margin: 0;
      padding: 0;
    }

    .hz-book-lesson {
      display: block;
      width: 230mm;
      height: 614mm;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: transparent;
    }

    @media print {
      html,
      body,
      #hz-book {
        background: #fff;
      }
    }
  </style>
</head>
<body>
  <main id="hz-book"></main>

  <!-- Classic local script: works when this file is opened directly via file://. -->
  <script src="./Lessons/manifest.js"></script>
  <script>
    (() => {
      const book = document.getElementById("hz-book");
      const lessons = Array.isArray(window.HORIZONS_A1_LESSONS)
        ? window.HORIZONS_A1_LESSONS
        : [];

      lessons.forEach((filename) => {
        const frame = document.createElement("iframe");
        frame.className = "hz-book-lesson";
        frame.src = `./Lessons/${filename}`;
        frame.title = `Horizons A1 ${filename.replace(/\.html$/i, "")}`;
        frame.loading = "eager";
        book.appendChild(frame);
      });
    })();
  </script>
</body>
</html>
