<!doctype html><html lang="en"><meta charset="utf-8"><title>Distinct whole-body postures</title><style>body{margin:0;padding:22px;background:#fffdfa;font:16px system-ui;color:#19475c}h1{font-size:26px}.proof-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.pose{height:245px;background:#fff1d8;border-radius:24px}.pose>.raster-frame{position:relative;width:100%;height:100%;display:block;overflow:hidden}.label{text-align:center;margin:8px 0 15px}</style><h1>Four distinct whole-body postures per companion</h1><div class="proof-grid" id="proof"></div><script type="module">import{loadArt,artManifest,rasterMarkup}from'../src/art.js';await loadArt();const m=artManifest();for(let row=0;row<4;row++)for(const name of['pico','mina','alex','jo']){const [pose,asset]=Object.entries(m.postures[name])[row],cell=document.createElement('div');cell.innerHTML=`<div class="pose">${rasterMarkup(asset,'','')}</div><div class="label">${name} · ${pose}</div>`;document.getElementById('proof').append(cell);}</script></html>
