name: Fix Custom Domain OG

on:
  push:
    paths:
      - ".github/workflows/fix-custom-domain-og.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point OG metadata at custom domain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          BASE = "https://exams.bebrighton.net/"
          IMAGE = BASE + "Exams/assets/og-whatsapp.jpg?v=20260922b"

          targets = sorted(list(Path("Exams").rglob("*.html")) + list(Path("Placement").rglob("*.html")))

          def canonical_for(path):
              p = path.as_posix()
              if p.endswith("/index.html"):
                  p = p[:-len("index.html")]
              return BASE + p

          for path in targets:
              html = path.read_text(encoding="utf-8")
              canonical = canonical_for(path)

              html = re.sub(
                  r'<meta\s+property=["\']og:image["\'][^>]*>',
                  f'<meta property="og:image" content="{IMAGE}" />',
                  html,
                  flags=re.I,
              )
              html = re.sub(
                  r'<meta\s+property=["\']og:image:secure_url["\'][^>]*>',
                  f'<meta property="og:image:secure_url" content="{IMAGE}" />',
                  html,
                  flags=re.I,
              )
              html = re.sub(
                  r'<meta\s+property=["\']og:url["\'][^>]*>',
                  f'<meta property="og:url" content="{canonical}" />',
                  html,
                  flags=re.I,
              )
              html = re.sub(
                  r'<link\s+rel=["\']canonical["\'][^>]*>',
                  f'<link rel="canonical" href="{canonical}" />',
                  html,
                  flags=re.I,
              )
              html = re.sub(
                  r'<link\s+rel=["\']image_src["\'][^>]*>',
                  f'<link rel="image_src" href="{IMAGE}" />',
                  html,
                  flags=re.I,
              )
              html = re.sub(
                  r'<meta\s+name=["\']twitter:image["\'][^>]*>',
                  f'<meta name="twitter:image" content="{IMAGE}" />',
                  html,
                  flags=re.I,
              )

              # Explicit image URL alias for crawlers that prefer it.
              html = re.sub(
                  r'\s*<meta\s+property=["\']og:image:url["\'][^>]*>\s*',
                  "\n",
                  html,
                  flags=re.I,
              )
              anchor = f'<meta property="og:image" content="{IMAGE}" />'
              html = html.replace(
                  anchor,
                  anchor + f'\n  <meta property="og:image:url" content="{IMAGE}" />',
                  1,
              )

              path.write_text(html, encoding="utf-8")

          print("Updated", len(targets), "pages to", BASE)
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Exams Placement
          git commit -m "Use custom domain for Brighton OG metadata"
          git push
