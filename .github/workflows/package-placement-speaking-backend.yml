name: Package Placement Speaking Backend

on:
  push:
    paths:
      - ".github/workflows/package-placement-speaking-backend.yml"
      - "Placement/wix-backend/gemini-speaking.js"
      - "Placement/wix-backend/placement.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Wix replacement package
        shell: bash
        run: |
          mkdir -p release/Backend
          cp Placement/wix-backend/gemini-speaking.js release/Backend/gemini-speaking.js
          cp Placement/wix-backend/placement.js release/Backend/placement.js
          cat > release/README.txt <<'EOF'
          Brighton Placement Speaking backend replacement
          
          Replace ONLY these files in the Brighton Exams Wix Velo Backend:
          - Backend/gemini-speaking.js
          - Backend/placement.js
          
          Do NOT replace:
          - Backend/http-functions.js
          - Backend/core.js
          - Backend/exams.js
          - Backend/tests.js
          
          Keep the existing Wix Secrets Manager entry:
          BRIGHTON_PLACEMENT_GEMINI_API_KEY
          
          After replacing the two files, publish the Wix site.
          
          GitHub source includes:
          - Gemini GenerateContent primary path
          - gemini-3.8-flash primary
          - gemini-3.5-flash-lite fallback
          - schema-free JSON retry on provider 400/422
          - provider errors converted to controlled Speaking technical errors instead of HTTP 500
          EOF

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: brighton-placement-speaking-wix-backend-fix
          path: release/
          if-no-files-found: error
          retention-days: 7
