<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizons A1 — Student's Book</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #ececec;
    }

    #hz-book {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 230mm;
      margin: 0;
      padding: 0;
    }

    .hz-book-lesson {
      display: block;
      width: 230mm;
      height: 614mm;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: transparent;
    }

    .hz-pdf-button {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #202124;
      color: #fff;
      box-shadow: 0 4px 16px rgb(0 0 0 / 24%);
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
    }

    .hz-pdf-button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgb(0 0 0 / 28%);
    }

    .hz-pdf-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .hz-pdf-button:disabled {
      opacity: .68;
      cursor: progress;
    }

    .hz-pdf-button svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hz-pdf-button.is-busy svg {
      animation: hz-pdf-pulse 900ms ease-in-out infinite alternate;
    }

    .hz-export-frame {
      position: fixed;
      top: 0;
      left: -10000px;
      width: 230mm;
      height: 620mm;
      border: 0;
      pointer-events: none;
    }

    @keyframes hz-pdf-pulse {
      from { opacity: .35; }
      to { opacity: 1; }
    }

    @media print {
      html,
      body,
      #hz-book {
        background: #fff;
      }

      .hz-pdf-button,
      .hz-export-frame {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <main id="hz-book"></main>

  <button class="hz-pdf-button" id="hz-pdf-button" type="button" aria-label="Download Student's Book as PDF" title="Download PDF">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3v12"></path>
      <path d="m7 10 5 5 5-5"></path>
      <path d="M5 21h14"></path>
    </svg>
  </button>

  <!-- The visible book remains fully local and works directly through file://. -->
  <script src="./Lessons/manifest.js"></script>

  <!-- PDF export libraries. The PDF is built deliberately one A4 page at a time. -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>

  <script>
    (() => {
      const book = document.getElementById("hz-book");
      const pdfButton = document.getElementById("hz-pdf-button");
      const lessons = Array.isArray(window.HORIZONS_A1_LESSONS)
        ? window.HORIZONS_A1_LESSONS
        : [];

      const RAW_LESSONS_ROOT = "https://raw.githubusercontent.com/Chiispiitas/Brighton/main/Horizons/A1/Lessons/";
      const A4_WIDTH_MM = 210;
      const A4_HEIGHT_MM = 297;
      const EXPORT_SCALE = 2.35;
      const JPEG_QUALITY = 0.97;

      lessons.forEach((filename) => {
        const frame = document.createElement("iframe");
        frame.className = "hz-book-lesson";
        frame.src = `./Lessons/${filename}`;
        frame.title = `Horizons A1 ${filename.replace(/\.html$/i, "")}`;
        frame.loading = "eager";
        book.appendChild(frame);
      });

      function setExportBusy(isBusy) {
        pdfButton.disabled = isBusy;
        pdfButton.classList.toggle("is-busy", isBusy);
        pdfButton.setAttribute(
          "aria-label",
          isBusy ? "Building Student's Book PDF" : "Download Student's Book as PDF"
        );
        pdfButton.title = isBusy ? "Building PDF…" : "Download PDF";
      }

      async function fetchLessonForExport(filename) {
        const url = RAW_LESSONS_ROOT + encodeURIComponent(filename);
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${filename} for PDF export.`);
        }

        const html = await response.text();
        const base = `<base href="${RAW_LESSONS_ROOT}">`;
        return html.replace(/<head(\s[^>]*)?>/i, (match) => `${match}\n  ${base}`);
      }

      async function waitForImages(doc) {
        const imagePromises = [...doc.images].map((image) => {
          if (image.complete) return Promise.resolve();
          return new Promise((resolve) => {
            image.addEventListener("load", resolve, { once: true });
            image.addEventListener("error", resolve, { once: true });
          });
        });

        await Promise.all(imagePromises);
      }

      async function preloadBackgroundImages(doc) {
        const urls = new Set();
        const view = doc.defaultView;
        const urlPattern = /url\(["']?(.*?)["']?\)/g;

        doc.querySelectorAll("*").forEach((element) => {
          const background = view.getComputedStyle(element).backgroundImage;
          let match;
          while ((match = urlPattern.exec(background)) !== null) {
            if (match[1] && match[1] !== "none") urls.add(match[1]);
          }
        });

        await Promise.all([...urls].map((src) => new Promise((resolve) => {
          const image = new Image();
          image.crossOrigin = "anonymous";
          image.onload = resolve;
          image.onerror = resolve;
          image.src = src;
        })));
      }

      async function makeExportFrame(filename) {
        const html = await fetchLessonForExport(filename);
        const frame = document.createElement("iframe");
        frame.className = "hz-export-frame";
        frame.setAttribute("aria-hidden", "true");

        const loaded = new Promise((resolve) => {
          frame.addEventListener("load", resolve, { once: true });
        });

        document.body.appendChild(frame);
        frame.srcdoc = html;
        await loaded;

        const doc = frame.contentDocument;
        if (!doc) throw new Error(`Could not prepare ${filename} for PDF export.`);

        if (doc.fonts && doc.fonts.ready) await doc.fonts.ready;
        await waitForImages(doc);
        await preloadBackgroundImages(doc);

        await new Promise((resolve) => {
          frame.contentWindow.requestAnimationFrame(() => {
            frame.contentWindow.requestAnimationFrame(resolve);
          });
        });

        return frame;
      }

      function renderCleanupStyles(clonedDoc) {
        const style = clonedDoc.createElement("style");
        style.textContent = `
          html, body {
            margin: 0 !important;
            padding: 0 !important;
            background: #fff !important;
          }
          .hz-page {
            margin: 0 !important;
            box-shadow: none !important;
          }
        `;
        clonedDoc.head.appendChild(style);
      }

      async function renderPage(page) {
        return window.html2canvas(page, {
          scale: EXPORT_SCALE,
          useCORS: true,
          allowTaint: false,
          backgroundColor: "#ffffff",
          logging: false,
          imageTimeout: 30000,
          removeContainer: true,
          onclone: renderCleanupStyles
        });
      }

      async function exportPdf() {
        if (!lessons.length) throw new Error("No lessons are listed in the A1 manifest.");
        if (!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF) {
          throw new Error("The PDF libraries could not be loaded.");
        }

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: "portrait",
          unit: "mm",
          format: "a4",
          compress: true,
          putOnlyUsedFonts: true
        });

        pdf.setProperties({
          title: "Horizons A1 — Student's Book",
          subject: "Horizons A1 Student's Book",
          author: "Brighton",
          creator: "Horizons Student's Book assembler"
        });

        let pageCount = 0;

        for (const filename of lessons) {
          const frame = await makeExportFrame(filename);
          try {
            const doc = frame.contentDocument;
            const pages = [...doc.querySelectorAll("article.hz-page")];

            if (!pages.length) {
              throw new Error(`${filename} contains no .hz-page elements.`);
            }

            for (const page of pages) {
              const canvas = await renderPage(page);
              const imageData = canvas.toDataURL("image/jpeg", JPEG_QUALITY);

              if (pageCount > 0) {
                pdf.addPage("a4", "portrait");
              }

              pdf.addImage(
                imageData,
                "JPEG",
                0,
                0,
                A4_WIDTH_MM,
                A4_HEIGHT_MM,
                undefined,
                "FAST"
              );

              pageCount += 1;
              canvas.width = 1;
              canvas.height = 1;
            }
          } finally {
            frame.remove();
          }
        }

        if (!pageCount) throw new Error("No book pages were exported.");
        pdf.save("Horizons A1 - Student's Book.pdf");
      }

      pdfButton.addEventListener("click", async () => {
        if (pdfButton.disabled) return;
        setExportBusy(true);

        try {
          await exportPdf();
        } catch (error) {
          console.error(error);
          alert(`PDF export failed. ${error.message}`);
        } finally {
          setExportBusy(false);
        }
      });
    })();
  </script>
</body>
</html>
