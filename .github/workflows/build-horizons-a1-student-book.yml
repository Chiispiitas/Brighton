name: Build Horizons A1 Student Book

on:
  push:
    paths:
      - "Horizons/A1/Lessons/**"
      - "Horizons/Base/design-system/**"
      - "Horizons/Base/shell/**"
      - "Horizons/Base/build/build-students-book.mjs"
      - ".github/workflows/build-horizons-a1-student-book.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horizons-a1-student-book
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Student's Book HTML
        run: node Horizons/Base/build/build-students-book.mjs

      - name: Build Student's Book PDF at true A4 scale
        shell: bash
        run: |
          set -euo pipefail

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser is available on the runner."
            exit 1
          fi

          npm install --no-save --no-package-lock puppeteer-core@24

          CHROME="$CHROME" node - <<'NODE'
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');
          const puppeteer = require('puppeteer-core');

          (async () => {
            const htmlPath = path.resolve("Horizons/A1/Student's Book.html");
            const pdfPath = path.resolve("Horizons/A1/Student's Book.pdf");
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-gpu',
                '--allow-file-access-from-files'
              ]
            });

            try {
              const page = await browser.newPage();
              await page.goto(pathToFileURL(htmlPath).href, { waitUntil: 'networkidle0' });
              await page.emulateMediaType('print');

              // Print geometry is deliberately stricter than the screen viewer.
              // No viewer width, screen spacing, zoom or fit-to-page behavior may
              // reduce the physical 210 x 297 mm lesson page.
              await page.addStyleTag({ content: `
                @page {
                  size: 210mm 297mm !important;
                  margin: 0 !important;
                }

                @media print {
                  html,
                  body,
                  body.hz-book,
                  #hz-book {
                    width: 210mm !important;
                    min-width: 210mm !important;
                    max-width: 210mm !important;
                    margin: 0 !important;
                    padding: 0 !important;
                    zoom: 1 !important;
                    transform: none !important;
                  }

                  #hz-book {
                    display: block !important;
                  }

                  .hz-page {
                    box-sizing: border-box !important;
                    width: 210mm !important;
                    min-width: 210mm !important;
                    max-width: 210mm !important;
                    height: 297mm !important;
                    min-height: 297mm !important;
                    max-height: 297mm !important;
                    margin: 0 !important;
                    padding: 0 !important;
                    zoom: 1 !important;
                    transform: none !important;
                    box-shadow: none !important;
                    break-after: page !important;
                    page-break-after: always !important;
                  }

                  .hz-page:last-child {
                    break-after: auto !important;
                    page-break-after: auto !important;
                  }

                  .hz-pdf-button {
                    display: none !important;
                  }
                }
              ` });

              await page.pdf({
                path: pdfPath,
                width: '210mm',
                height: '297mm',
                margin: { top: 0, right: 0, bottom: 0, left: 0 },
                printBackground: true,
                preferCSSPageSize: true,
                scale: 1,
                displayHeaderFooter: false
              });
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          test -s "Horizons/A1/Student's Book.pdf"

      - name: Optimize Student's Book PDF
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ghostscript
          fi

          INPUT="$PWD/Horizons/A1/Student's Book.pdf"
          OUTPUT="$PWD/Horizons/A1/Student's Book.optimized.pdf"

          gs \
            -sDEVICE=pdfwrite \
            -dCompatibilityLevel=1.6 \
            -dNOPAUSE \
            -dQUIET \
            -dBATCH \
            -dDetectDuplicateImages=true \
            -dCompressFonts=true \
            -dSubsetFonts=true \
            -dDownsampleColorImages=true \
            -dColorImageDownsampleType=/Bicubic \
            -dColorImageResolution=200 \
            -dAutoFilterColorImages=false \
            -dColorImageFilter=/DCTEncode \
            -dJPEGQ=90 \
            -dDownsampleGrayImages=true \
            -dGrayImageDownsampleType=/Bicubic \
            -dGrayImageResolution=200 \
            -dAutoFilterGrayImages=false \
            -dGrayImageFilter=/DCTEncode \
            -dDownsampleMonoImages=true \
            -dMonoImageResolution=300 \
            -sOutputFile="$OUTPUT" \
            "$INPUT"

          test -s "$OUTPUT"
          mv "$OUTPUT" "$INPUT"

          PDF_BYTES="$(stat -c%s "$INPUT")"
          PDF_MB="$(python3 - <<PY
          size = $PDF_BYTES
          print(f"{size / 1024 / 1024:.2f}")
          PY
          )"
          echo "Optimized PDF size: ${PDF_MB} MB"

          if [ "$PDF_BYTES" -ge 95000000 ]; then
            echo "Optimized PDF is still too large for safe GitHub storage."
            exit 1
          fi

      - name: Validate assembled PDF
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi

          EXPECTED_PAGES="$(node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync("Horizons/A1/Student's Book.html", "utf8");
          const pages = html.match(/<article\b[^>]*class=["'][^"']*\bhz-page\b[^"']*["'][^>]*>/gi) || [];
          process.stdout.write(String(pages.length));
          NODE
          )"

          ACTUAL_PAGES="$(pdfinfo "Horizons/A1/Student's Book.pdf" | awk '/^Pages:/ { print $2 }')"
          PAGE_SIZE="$(pdfinfo "Horizons/A1/Student's Book.pdf" | awk -F': ' '/^Page size:/ { print $2 }')"

          echo "Expected A4 pages: $EXPECTED_PAGES"
          echo "Generated PDF pages: $ACTUAL_PAGES"
          echo "Generated PDF page size: $PAGE_SIZE"

          if [ "$EXPECTED_PAGES" -lt 1 ]; then
            echo "No .hz-page elements were found in the compiled book."
            exit 1
          fi

          if [ "$EXPECTED_PAGES" != "$ACTUAL_PAGES" ]; then
            echo "PDF page count does not match the compiled book."
            exit 1
          fi

          pdfinfo "Horizons/A1/Student's Book.pdf" | grep -q "Page size:.*A4" || {
            echo "Generated PDF is not A4."
            pdfinfo "Horizons/A1/Student's Book.pdf"
            exit 1
          }

      - name: Render PDF QA previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/horizons-a1-pdf-preview
          LAST_PAGE="$(pdfinfo "Horizons/A1/Student's Book.pdf" | awk '/^Pages:/ { print $2 }')"
          pdftoppm -f 1 -singlefile -png -r 120 "Horizons/A1/Student's Book.pdf" /tmp/horizons-a1-pdf-preview/first-page
          pdftoppm -f "$LAST_PAGE" -singlefile -png -r 120 "Horizons/A1/Student's Book.pdf" /tmp/horizons-a1-pdf-preview/last-page

      - name: Upload PDF QA previews
        uses: actions/upload-artifact@v4
        with:
          name: horizons-a1-pdf-preview
          path: /tmp/horizons-a1-pdf-preview/*.png
          if-no-files-found: error
          retention-days: 3

      - name: Commit compiled book when changed
        shell: bash
        run: |
          STATUS="$(git status --porcelain -- "Horizons/A1/Student's Book.html" "Horizons/A1/Student's Book.pdf")"
          if [ -z "$STATUS" ]; then
            echo "Student's Book HTML and PDF are already up to date."
            exit 0
          fi

          echo "$STATUS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Horizons/A1/Student's Book.html" "Horizons/A1/Student's Book.pdf"
          git commit -m "Build A1 Student's Book HTML and PDF [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin main
