name: Fix certificate backsides

on:
  push:
    branches:
      - fix-c1-b1plus-backsides
    paths:
      - '.github/workflows/inspect-certificate-backsides.yml'
      - 'tools/inspect_certificate_backsides.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-c1-b1plus-backsides
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pymupdf
      - name: Fix and verify PDFs
        run: python tools/inspect_certificate_backsides.py
      - name: Commit corrected C1 backside
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Certificate Generator/C1 Backside.pdf"
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Fix C1 backside wrapping and B1+ glyph"
            git push
          fi
