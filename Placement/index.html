<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Brighton English School adaptive placement test" />
  <title>Brighton Placement</title>
  <link rel="icon" type="image/png" href="../Exams/assets/favicon.png" />
  <link rel="stylesheet" href="styles.css?v=20260920-flat-noshadow1" />
</head>
<body>
  <main class="placement-app">
    <section id="startScreen" class="start-screen" aria-labelledby="placementTitle">
      <div class="start-card">
        <header class="brand-row">
          <img src="../Exams/assets/brighton-logo.png" alt="Brighton English School" />
          <span class="time-chip">≈ 15 min</span>
        </header>

        <div class="start-grid">
          <div class="hero-copy">
            <p class="eyebrow">Brighton English School</p>
            <h1 id="placementTitle">Placement Test</h1>
            <div class="route-preview" aria-label="Placement stages">
              <div class="route-stage active"><span class="route-number">01</span><span>Language</span></div>
              <div class="route-line" aria-hidden="true"></div>
              <div class="route-stage"><span class="route-number">02</span><span>Reading</span></div>
              <div class="route-line" aria-hidden="true"></div>
              <div class="route-stage"><span class="route-number">03</span><span>Listening</span></div>
              <div class="route-line" aria-hidden="true"></div>
              <div class="route-stage"><span class="route-number">04</span><span>Speaking</span></div>
            </div>
          </div>

          <form id="studentForm" class="player-card" novalidate>
            <label for="studentName">Full name</label>
            <input id="studentName" name="studentName" type="text" autocomplete="name" maxlength="90" placeholder="Your name" required />
            <button id="startBtn" class="primary-btn" type="submit"><span>Start</span><span aria-hidden="true">→</span></button>
            <p class="micro-copy">Use headphones. You'll speak at the end.</p>
            <p id="formError" class="form-error" role="alert" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>

    <section id="transitionScreen" class="transition-screen hidden" aria-live="polite">
      <img src="../Exams/assets/brighton-logo.png" alt="" aria-hidden="true" />
      <div id="transitionStage" class="transition-stage">01</div>
      <p id="transitionLabel">Calibration</p>
      <div class="scan-line" aria-hidden="true"><span></span></div>
    </section>

    <section id="placementShell" class="placement-shell hidden">
      <header class="shell-header">
        <img src="../Exams/assets/brighton-logo.png" alt="Brighton English School" />
        <div class="shell-route" aria-label="Placement progress">
          <span class="shell-node active">01</span><span class="shell-track"></span>
          <span class="shell-node">02</span><span class="shell-track"></span>
          <span class="shell-node">03</span><span class="shell-track"></span>
          <span class="shell-node">04</span>
        </div>
        <div class="shell-actions">
          <span id="candidateName" class="candidate-name"></span>
          <button id="restartTestBtn" class="restart-test-btn" type="button">Restart test</button>
        </div>
      </header>

      <main class="stage-main">
        <section id="stageCard" class="stage-card">
          <div id="stageIndex" class="stage-index">01</div>
          <p id="stageEyebrow" class="eyebrow">Calibration</p>
          <h2 id="stageTitle">Grammar</h2>
          <p id="stageNote" class="stage-note">5 quick questions.</p>

          <div id="introScan" class="level-scan" aria-hidden="true">
            <span>A1</span><span>A2</span><span>B1</span><span>B2</span><i></i>
          </div>

          <div id="placementStageRoot" class="handoff-slot" aria-live="polite"></div>
        </section>
      </main>
    </section>
  </main>

  <script src="../Exams/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="item-bank.js?v=20260920-speaking-rubric11"></script>
  <script src="main.js?v=20260920-adapting1"></script>
</body>
</html>
