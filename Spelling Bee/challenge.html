<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A mixed spelling challenge. Listen, spell aloud, then move to the next word.">
  <title>Spelling Challenge</title>
  <link rel="icon" href="assets/logo.png">
  <style>
    :root { color-scheme:dark; font-family:system-ui,'Segoe UI',sans-serif; color:#f2ead6; background:#0d0f18; }
    * { box-sizing:border-box; }
    body { min-height:100svh; margin:0; display:grid; grid-template-rows:auto 1fr; background:radial-gradient(ellipse at 50% 40%,#30202c66,transparent 65%),linear-gradient(145deg,#0a0c13,#15111a 48%,#0b0f17); }
    header { display:flex; align-items:center; gap:12px; padding:24px clamp(20px,5vw,70px); color:#b7aa90; font-size:12px; letter-spacing:.03em; }
    header img { width:48px; height:48px; object-fit:contain; }
    main { width:min(100%,600px); margin:auto; padding:30px 24px 90px; text-align:center; }
    h1 { font-family:Georgia,serif; font-size:clamp(34px,7vw,54px); font-weight:400; margin:0 0 18px; }
    .progress { color:#b7aa90; font-size:15px; margin:0 0 38px; font-variant-numeric:tabular-nums; }
    .actions { display:grid; gap:16px; max-width:360px; margin:auto; }
    button { width:100%; border:1px solid #c8a96b55; border-radius:12px; padding:19px 24px; font:inherit; font-size:17px; color:#f2ead6; background:#ffffff06; cursor:pointer; touch-action:manipulation; transition:background .2s,transform .15s; }
    button:hover { background:#ffffff0e; }
    button:active { transform:scale(.98); }
    button:focus-visible { outline:3px solid #eac472; outline-offset:5px; }
    #listen { min-height:150px; background:#c8a96b12; border-color:#c8a96b99; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
    #listen svg { width:38px; height:38px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    #listen[data-playing=true] { background:#c8a96b25; }
    #next { border-color:transparent; color:#c8a96b; }
    #status { min-height:42px; margin:22px 0 0; color:#b7aa90; font-size:13px; line-height:1.5; }
    [hidden] { display:none!important; }
    @media(prefers-reduced-motion:reduce) { button { transition:none; } }
  </style>
</head>
<body>
  <header><img src="assets/logo.png" alt="Lev Vigotsky school logo"><span>U.E.P LEV VIGOTSKY MANTA</span></header>
  <main>
    <h1 id="heading">Spelling challenge</h1>
    <p class="progress" id="progress" aria-live="polite"></p>
    <div class="actions">
      <button type="button" id="listen" aria-label="Play pronunciation">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M14 6 6 12H2v8h4l8 6V6Z"/><path d="M20 10a8 8 0 0 1 0 12M25 5a15 15 0 0 1 0 22"/></svg>
        <span id="listen-label">Play audio</span>
      </button>
      <button type="button" id="next">Next word →</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <audio id="pronunciation" preload="auto" hidden></audio>
  </main>
  <script src="js/challenge.js?v=20261022-mixed1"></script>
</body>
</html>
