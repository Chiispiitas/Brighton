name: Build C1 Advanced backside

on:
  push:
    branches:
      - c1-advanced-backside
    paths:
      - '.github/workflows/build-c1-backside.yml'
      - 'tools/build_c1_backside.py'
      - 'Certificate Generator/B2 Backside.pdf'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: c1-advanced-backside

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tooling
        run: python -m pip install --upgrade pymupdf

      - name: Build and verify C1 backside
        run: python tools/build_c1_backside.py

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Certificate Generator/C1 Backside.pdf"
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Add C1 Advanced certificate backside"
            git push
          fi
