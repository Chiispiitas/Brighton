name: Validate Brighton exam answer keys

on:
  pull_request:
    paths:
      - "Exams/**"
      - ".github/workflows/validate-exam-answer-keys.yml"
  push:
    branches:
      - main
    paths:
      - "Exams/**"
      - ".github/workflows/validate-exam-answer-keys.yml"

permissions:
  contents: read

jobs:
  validate-answer-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Protect immutable answer-key releases
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed="$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- 'Exams/answer-keys/versions/**' | awk '$1 !~ /^A/ { print }')"
          if [ -n "$changed" ]; then
            echo "Existing answer-key release snapshots are immutable. Create a new release directory instead of modifying or deleting an old one."
            echo "$changed"
            exit 1
          fi
      - name: Validate assessment dashboard JavaScript syntax
        run: node --check Exams/results.js
      - name: Validate A1 Reading and Writing JavaScript syntax
        run: |
          node --check Exams/exams/a1-rw/main.js
          node --check Exams/exams/a1-rw/exam-data.js
          node --check Exams/config.js
      - name: Validate A1 Listening JavaScript syntax
        run: |
          node --check Exams/exams/a1-listening/main.js
          node --check Exams/exams/a1-listening/listening-data.js
          node --check Exams/exams/a1-listening/visual-layouts.js
          node --check Exams/exams/a1-listening/layout-editor/app.js
      - name: Validate A1 Listening layout editor selector usage
        run: |
          node <<'NODE'
          const fs = require("fs");
          const source = fs.readFileSync("Exams/exams/a1-listening/layout-editor/app.js", "utf8");
          const bad = source.split("\n").filter(line =>
            /(^|[^$])\$\([^\n]*\)\.forEach\(/.test(line)
          );
          if (bad.length) {
            throw new Error("Layout editor calls .forEach() on $() instead of $():\n" + bad.join("\n"));
          }
          NODE
      - name: Validate A1 player boot wiring
        run: |
          node <<'NODE'
          const fs = require("fs");
          const source = fs.readFileSync("Exams/exams/a1-rw/main.js", "utf8");
          const required = [
            'dom.studentForm.addEventListener("submit"',
            "const renderers = {",
            "boot();",
            "async function submitPayload",
            "function calculateTimeSpentSeconds",
            "BRIGHTON_A1_RW_SUBMIT"
          ];
          for (const token of required) {
            if (!source.includes(token)) {
              throw new Error(`A1 player wiring is incomplete: missing ${token}`);
            }
          }
          if ((source.match(/\bboot\(\);/g) || []).length !== 1) {
            throw new Error("A1 player must call boot() exactly once.");
          }
          NODE
      - name: Audit A1 Reading and Writing consistency
        run: node Exams/validate-a1-rw-consistency.mjs
      - name: Audit A1 Listening consistency
        run: node Exams/validate-a1-listening-consistency.mjs
      - name: Audit Brighton test answer keys
        run: node Exams/validate-answer-keys.mjs
      - name: Cross-check answers across overlapping tests
        run: node Exams/validate-cross-test-answers.mjs
      - name: Validate immutable answer-key releases
        run: node Exams/validate-answer-key-releases.mjs
