<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="Brighton English School Placement Results">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brighton Placement Results</title>
  <link rel="icon" type="image/png" href="../Exams/assets/favicon.png" />
  <link rel="stylesheet" href="../Exams/portal.css?v=20260920-flat1" />
  <link rel="stylesheet" href="results.css?v=20260920-flat1" />
</head>
<body>
  <header class="portal-header">
    <a class="portal-brand" href="index.html" aria-label="Brighton Placement Test">
      <img src="../Exams/assets/brighton-logo.png" alt="Brighton English School" />
    </a>
    <div class="portal-title-block">
      <p class="eyebrow">Teacher area</p>
      <h1>Placement Results</h1>
    </div>
    <nav class="header-actions">
      <a class="secondary-btn" href="index.html">Placement Test</a>
    </nav>
  </header>

  <main class="portal-main placement-results-main">
    <section class="filter-card">
      <label>
        <span>Student</span>
        <input id="studentInput" type="text" placeholder="Optional: student name" />
      </label>
      <label>
        <span>Level</span>
        <select id="levelSelect">
          <option value="">All levels</option>
          <option>PRE-A1</option><option>A1</option><option>A2</option>
          <option>B1</option><option>B1+</option><option>B2</option><option>C1</option>
        </select>
      </label>
      <label>
        <span>Status</span>
        <select id="statusSelect">
          <option value="">All attempts</option>
          <option value="completed">Completed</option>
          <option value="active">In progress</option>
        </select>
      </label>
      <button id="loadBtn" class="primary-btn" type="button">Load results</button>
      <button id="clearBtn" class="secondary-btn" type="button">Clear</button>
      <button id="exportBtn" class="secondary-btn" type="button">Export CSV</button>
    </section>

    <section class="summary-grid">
      <article class="summary-card"><span>Total attempts</span><strong id="summaryTotal">0</strong></article>
      <article class="summary-card"><span>Completed</span><strong id="summaryCompleted">0</strong></article>
      <article class="summary-card"><span>Average speaking evidence</span><strong id="summaryConfidence">—</strong></article>
      <article class="summary-card"><span>Most common level</span><strong id="summaryLevel">—</strong></article>
    </section>

    <section class="results-card">
      <div class="section-head">
        <div>
          <h2>Placement attempts</h2>
          <p id="resultsStatus" class="muted">Loading placement results…</p>
        </div>
      </div>
      <div class="table-wrap">
        <table class="results-table placement-results-table">
          <thead>
            <tr>
              <th>Student</th>
              <th>Status</th>
              <th>Overall</th>
              <th>Started</th>
              <th>Completed</th>
              <th>Time</th>
              <th>Speaking evidence</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="resultsBody">
            <tr><td colspan="8">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="detailsModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card placement-modal-card">
      <div class="modal-head">
        <div>
          <p class="eyebrow">Placement attempt</p>
          <h2 id="detailsTitle">Student result</h2>
        </div>
        <button id="closeModalBtn" class="icon-btn" type="button" aria-label="Close">×</button>
      </div>
      <div id="detailsContent" class="details-content"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="../Exams/config.js"></script>
  <script src="results.js?v=20260920-speaking-rubric11"></script>
</body>
</html>
