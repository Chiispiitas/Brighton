<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brighton Teacher Main</title>
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <header class="portal-header">
    <a class="portal-brand" href="teacher.html" aria-label="Brighton English School teacher area">
      <img src="assets/brighton-logo.png" alt="Brighton English School" />
    </a>
    <div class="portal-title-block">
      <p class="eyebrow">Teacher area</p>
      <h1>Exam Control Panel</h1>
    </div>
    <nav class="header-actions">
      <a class="secondary-btn" href="results.html">Results Dashboard</a>
    </nav>
  </header>

  <main class="portal-main">
    <section class="toolbar-card exams-toolbar">
      <div class="brand-strip available-ribbon" aria-hidden="true">
        <span>☆</span><span>♡</span><span>✦</span><span>○</span><span>✶</span>
      </div>
      <div class="toolbar-content">
        <div>
          <h2>Available exams</h2>
          <p id="apiStatus" class="muted">Checking Brighton Database...</p>
        </div>
        <button id="refreshBtn" class="primary-btn small">Refresh</button>
      </div>
    </section>

    <section id="examGrid" class="exam-grid" aria-live="polite"></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="teacher.js"></script>
</body>
</html>
