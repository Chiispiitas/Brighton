name: Validate Brighton exam answer keys

on:
  pull_request:
    paths:
      - "Exams/**"
      - ".github/workflows/validate-exam-answer-keys.yml"
  push:
    branches:
      - main
    paths:
      - "Exams/**"
      - ".github/workflows/validate-exam-answer-keys.yml"

permissions:
  contents: read

jobs:
  validate-answer-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit Brighton test answer keys
        run: node Exams/validate-answer-keys.mjs
      - name: Cross-check answers across overlapping tests
        run: node Exams/validate-cross-test-answers.mjs
