<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizons A1 — Student's Book</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #ececec;
    }

    #hz-book {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 230mm;
      margin: 0;
      padding: 0;
    }

    .hz-pdf-button {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #202124;
      color: #fff;
      box-shadow: 0 4px 16px rgb(0 0 0 / 24%);
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
    }

    .hz-pdf-button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgb(0 0 0 / 28%);
    }

    .hz-pdf-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .hz-pdf-button:disabled {
      opacity: .58;
      cursor: progress;
    }

    .hz-pdf-button svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hz-pdf-button.is-busy svg {
      animation: hz-pdf-pulse 900ms ease-in-out infinite alternate;
    }

    .hz-book-error {
      max-width: 720px;
      margin: 32px auto;
      padding: 16px 20px;
      background: #fff;
      color: #202124;
      font: 14px/1.45 Arial, sans-serif;
      box-shadow: 0 2px 12px rgb(0 0 0 / 12%);
    }

    @keyframes hz-pdf-pulse {
      from { opacity: .35; }
      to { opacity: 1; }
    }

    @media print {
      html,
      body,
      #hz-book {
        background: #fff;
      }

      .hz-pdf-button,
      .hz-book-error {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <main id="hz-book"></main>

  <button class="hz-pdf-button" id="hz-pdf-button" type="button" aria-label="Download Student's Book as PDF" title="Download PDF" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3v12"></path>
      <path d="m7 10 5 5 5-5"></path>
      <path d="M5 21h14"></path>
    </svg>
  </button>

  <!-- The local file only loads this small local manifest. No lesson is embedded as a file:// frame. -->
  <script src="./Lessons/manifest.js"></script>

  <!-- PDF libraries. -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>

  <script>
    (() => {
      const book = document.getElementById("hz-book");
      const pdfButton = document.getElementById("hz-pdf-button");
      const lessons = Array.isArray(window.HORIZONS_A1_LESSONS)
        ? window.HORIZONS_A1_LESSONS
        : [];

      const RAW_REPO_ROOT = "https://raw.githubusercontent.com/Chiispiitas/Brighton/main/";
      const RAW_LESSONS_ROOT = `${RAW_REPO_ROOT}Horizons/A1/Lessons/`;
      const A4_WIDTH_MM = 210;
      const A4_HEIGHT_MM = 297;
      const EXPORT_SCALE = 2.35;
      const JPEG_QUALITY = 0.97;
      const stylesheetCache = new Map();
      const installedStylesheets = new Set();

      function setExportBusy(isBusy) {
        pdfButton.disabled = isBusy;
        pdfButton.classList.toggle("is-busy", isBusy);
        pdfButton.setAttribute(
          "aria-label",
          isBusy ? "Building Student's Book PDF" : "Download Student's Book as PDF"
        );
        pdfButton.title = isBusy ? "Building PDF…" : "Download PDF";
      }

      function showError(message) {
        const error = document.createElement("div");
        error.className = "hz-book-error";
        error.textContent = message;
        document.body.appendChild(error);
      }

      async function fetchText(url, label) {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${label || url}.`);
        }
        return response.text();
      }

      function rewriteCssAssetUrls(css, stylesheetUrl) {
        return css.replace(/url\(\s*(["']?)(.*?)\1\s*\)/gi, (match, quote, rawValue) => {
          const value = rawValue.trim();
          if (!value || /^(?:data:|blob:|https?:|#)/i.test(value)) return match;

          try {
            return `url("${new URL(value, stylesheetUrl).href}")`;
          } catch (error) {
            console.warn("Could not resolve CSS asset URL", value, stylesheetUrl, error);
            return match;
          }
        });
      }

      async function loadStylesheetInline(stylesheetUrl, stack = []) {
        if (stylesheetCache.has(stylesheetUrl)) {
          return stylesheetCache.get(stylesheetUrl);
        }

        if (stack.includes(stylesheetUrl)) {
          throw new Error(`Circular CSS import detected at ${stylesheetUrl}.`);
        }

        const nextStack = [...stack, stylesheetUrl];
        let css = await fetchText(stylesheetUrl, stylesheetUrl.split("/").pop());
        const importPattern = /@import\s+(?:url\(\s*)?["']([^"']+)["']\s*\)?\s*([^;]*);/gi;
        const imports = [...css.matchAll(importPattern)];

        for (const match of imports) {
          const importUrl = new URL(match[1], stylesheetUrl).href;
          let importedCss = await loadStylesheetInline(importUrl, nextStack);
          const mediaQuery = (match[2] || "").trim();

          if (mediaQuery) {
            importedCss = `@media ${mediaQuery} {\n${importedCss}\n}`;
          }

          css = css.replace(match[0], importedCss);
        }

        css = rewriteCssAssetUrls(css, stylesheetUrl);
        stylesheetCache.set(stylesheetUrl, css);
        return css;
      }

      async function loadLessonDocument(filename) {
        const lessonUrl = RAW_LESSONS_ROOT + encodeURIComponent(filename);
        const html = await fetchText(lessonUrl, filename);
        const doc = new DOMParser().parseFromString(html, "text/html");

        const stylesheetLinks = [...doc.querySelectorAll('head link[rel="stylesheet"]')];
        for (const link of stylesheetLinks) {
          const href = link.getAttribute("href");
          if (!href) {
            link.remove();
            continue;
          }

          const stylesheetUrl = new URL(href, lessonUrl).href;
          const style = doc.createElement("style");
          const media = link.getAttribute("media");
          if (media) style.media = media;
          style.dataset.sourceStylesheet = stylesheetUrl;
          style.textContent = await loadStylesheetInline(stylesheetUrl);
          link.replaceWith(style);
        }

        return { filename, lessonUrl, doc };
      }

      function installLessonStyles(lesson) {
        const styles = [...lesson.doc.head.querySelectorAll("style")];
        styles.forEach((sourceStyle, index) => {
          const sourceStylesheet = sourceStyle.dataset.sourceStylesheet || "";
          const key = sourceStylesheet || `${lesson.filename}:inline:${index}`;
          if (installedStylesheets.has(key)) return;
          installedStylesheets.add(key);

          const style = document.createElement("style");
          const media = sourceStyle.getAttribute("media");
          if (media) style.media = media;
          style.dataset.hzBookStyle = key;
          style.textContent = sourceStyle.textContent;
          document.head.appendChild(style);
        });
      }

      function installLessonPages(lesson) {
        const pages = [...lesson.doc.querySelectorAll("article.hz-page")];
        if (!pages.length) {
          throw new Error(`${lesson.filename} contains no .hz-page elements.`);
        }

        pages.forEach((page) => {
          const imported = document.importNode(page, true);
          imported.dataset.lessonSource = lesson.filename;
          book.appendChild(imported);
        });
      }

      async function waitForImages(doc) {
        const imagePromises = [...doc.images].map((image) => {
          if (image.complete) return Promise.resolve();
          return new Promise((resolve) => {
            image.addEventListener("load", resolve, { once: true });
            image.addEventListener("error", resolve, { once: true });
          });
        });

        await Promise.all(imagePromises);
      }

      async function preloadBackgroundImages(doc) {
        const urls = new Set();
        const urlPattern = /url\(["']?(.*?)["']?\)/g;

        doc.querySelectorAll("*").forEach((element) => {
          const background = getComputedStyle(element).backgroundImage;
          let match;
          while ((match = urlPattern.exec(background)) !== null) {
            if (match[1] && match[1] !== "none") urls.add(match[1]);
          }
        });

        await Promise.all([...urls].map((src) => new Promise((resolve) => {
          const image = new Image();
          image.crossOrigin = "anonymous";
          image.onload = resolve;
          image.onerror = resolve;
          image.src = src;
        })));
      }

      async function assembleBook() {
        if (!lessons.length) {
          throw new Error("No lessons are listed in the A1 manifest.");
        }

        for (const filename of lessons) {
          const lesson = await loadLessonDocument(filename);
          installLessonStyles(lesson);
          installLessonPages(lesson);
        }

        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        await waitForImages(document);
        await preloadBackgroundImages(document);
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      }

      function renderCleanupStyles(clonedDoc) {
        const style = clonedDoc.createElement("style");
        style.textContent = `
          html, body {
            margin: 0 !important;
            padding: 0 !important;
            background: #fff !important;
          }
          .hz-page {
            margin: 0 !important;
            box-shadow: none !important;
          }
          .hz-pdf-button,
          .hz-book-error {
            display: none !important;
          }
        `;
        clonedDoc.head.appendChild(style);
      }

      async function renderPage(page) {
        return window.html2canvas(page, {
          scale: EXPORT_SCALE,
          useCORS: true,
          allowTaint: false,
          backgroundColor: "#ffffff",
          logging: false,
          imageTimeout: 30000,
          removeContainer: true,
          onclone: renderCleanupStyles
        });
      }

      async function exportPdf() {
        if (!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF) {
          throw new Error("The PDF libraries could not be loaded.");
        }

        const pages = [...book.querySelectorAll("article.hz-page")];
        if (!pages.length) throw new Error("No book pages are available to export.");

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: "portrait",
          unit: "mm",
          format: "a4",
          compress: true,
          putOnlyUsedFonts: true
        });

        pdf.setProperties({
          title: "Horizons A1 — Student's Book",
          subject: "Horizons A1 Student's Book",
          author: "Brighton",
          creator: "Horizons Student's Book assembler"
        });

        for (let index = 0; index < pages.length; index += 1) {
          const canvas = await renderPage(pages[index]);
          const imageData = canvas.toDataURL("image/jpeg", JPEG_QUALITY);

          if (index > 0) {
            pdf.addPage("a4", "portrait");
          }

          pdf.addImage(
            imageData,
            "JPEG",
            0,
            0,
            A4_WIDTH_MM,
            A4_HEIGHT_MM,
            undefined,
            "FAST"
          );

          canvas.width = 1;
          canvas.height = 1;
        }

        pdf.save("Horizons A1 - Student's Book.pdf");
      }

      const bookReady = assembleBook();

      bookReady
        .then(() => {
          pdfButton.disabled = false;
        })
        .catch((error) => {
          console.error(error);
          showError(`The Student's Book could not be assembled. ${error.message}`);
        });

      pdfButton.addEventListener("click", async () => {
        if (pdfButton.disabled) return;
        setExportBusy(true);

        try {
          await bookReady;
          await exportPdf();
        } catch (error) {
          console.error(error);
          alert(`PDF export failed. ${error.message}`);
        } finally {
          setExportBusy(false);
        }
      });
    })();
  </script>
</body>
</html>
