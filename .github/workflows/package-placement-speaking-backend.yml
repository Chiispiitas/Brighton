name: Package Placement Speaking Backend

on:
  push:
    paths:
      - ".github/workflows/package-placement-speaking-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Wix replacement package
        shell: bash
        run: |
          mkdir -p release/Backend
          cp Placement/wix-backend/gemini-speaking.js release/Backend/gemini-speaking.js
          cp Placement/wix-backend/placement.js release/Backend/placement.js
          cat > release/README.txt <<'EOF'
          Brighton Placement Speaking backend replacement v3

          Replace ONLY:
          Backend/gemini-speaking.js
          Backend/placement.js

          Keep the existing:
          Backend/http-functions.js
          Backend/core.js
          Backend/exams.js
          Backend/tests.js

          Then Publish Wix.

          This build:
          - Interactions API primary
          - GenerateContent API fallback
          - gemini-3.8-flash primary
          - gemini-3.5-flash-lite fallback
          - structured JSON and schema-free retries
          - safe provider status/code returned instead of HTTP 500
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: brighton-placement-speaking-wix-backend-fix-v3
          path: release/
          retention-days: 7
