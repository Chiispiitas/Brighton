name: Fix WhatsApp OG Preview

on:
  push:
    paths:
      - ".github/workflows/fix-whatsapp-og-preview.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build crawler-friendly social image
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path("Exams/assets/og.png")
          dst = Path("Exams/assets/og-whatsapp.jpg")

          im = Image.open(src).convert("RGB")
          if im.size != (1200, 630):
              im = im.resize((1200, 630), Image.Resampling.LANCZOS)

          im.save(
              dst,
              "JPEG",
              quality=84,
              optimize=True,
              progressive=True,
              subsampling="4:2:0"
          )
          print("source:", src.stat().st_size, "bytes")
          print("jpeg:", dst.stat().st_size, "bytes", im.size)
          PY

      - name: Harden Open Graph metadata
        shell: bash
        run: |
          from pathlib import Path
          import re

          BASE = "https://chiispiitas.github.io/Brighton/"
          IMAGE = BASE + "Exams/assets/og-whatsapp.jpg?v=20260922"

          targets = sorted(list(Path("Exams").rglob("*.html")) + list(Path("Placement").rglob("*.html")))

          def canonical_for(path):
              p = path.as_posix()
              if p.endswith("/index.html"):
                  p = p[:-len("index.html")]
              return BASE + p

          def upsert(html, pattern, replacement):
              if re.search(pattern, html, flags=re.I):
                  return re.sub(pattern, replacement, html, count=1, flags=re.I)
              return re.sub(r"(</title>)", r"\1\n  " + replacement, html, count=1, flags=re.I)

          for path in targets:
              html = path.read_text(encoding="utf-8")
              canonical = canonical_for(path)

              # Remove old secondary image metadata so each page has one clean block.
              html = re.sub(r'\s*<meta\s+property=["\']og:image:(?:secure_url|type|width|height|alt)["\'][^>]*>\s*', "\n", html, flags=re.I)
              html = re.sub(r'\s*<meta\s+property=["\']og:url["\'][^>]*>\s*', "\n", html, flags=re.I)
              html = re.sub(r'\s*<meta\s+property=["\']og:site_name["\'][^>]*>\s*', "\n", html, flags=re.I)
              html = re.sub(r'\s*<link\s+rel=["\']canonical["\'][^>]*>\s*', "\n", html, flags=re.I)
              html = re.sub(r'\s*<link\s+rel=["\']image_src["\'][^>]*>\s*', "\n", html, flags=re.I)

              html = re.sub(
                  r'<meta\s+property=["\']og:image["\'][^>]*>',
                  f'<meta property="og:image" content="{IMAGE}" />',
                  html,
                  count=1,
                  flags=re.I,
              )
              html = re.sub(
                  r'<meta\s+name=["\']twitter:image["\'][^>]*>',
                  f'<meta name="twitter:image" content="{IMAGE}" />',
                  html,
                  count=1,
                  flags=re.I,
              )

              anchor = f'<meta property="og:image" content="{IMAGE}" />'
              extra = (
                  anchor +
                  f'\n  <meta property="og:image:secure_url" content="{IMAGE}" />'
                  f'\n  <meta property="og:image:type" content="image/jpeg" />'
                  f'\n  <meta property="og:image:width" content="1200" />'
                  f'\n  <meta property="og:image:height" content="630" />'
                  f'\n  <meta property="og:image:alt" content="Brighton English School" />'
                  f'\n  <meta property="og:url" content="{canonical}" />'
                  f'\n  <meta property="og:site_name" content="Brighton English School" />'
                  f'\n  <link rel="canonical" href="{canonical}" />'
                  f'\n  <link rel="image_src" href="{IMAGE}" />'
              )
              html = html.replace(anchor, extra, 1)

              path.write_text(html, encoding="utf-8")

          print("Updated", len(targets), "pages")
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Exams Placement
          git commit -m "Harden OG previews for WhatsApp"
          git push
