<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="description" content="Brighton English School Digital Tests by CEFR level and unit range">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brighton Tests</title>
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="tests-menu.css" />
</head>
<body class="assessment-home-body tests-home-body">
  <main class="assessment-home tests-home">
    <header class="assessment-home-header tests-home-header">
      <a href="index.html" aria-label="Back to Brighton Assessment Center">
        <img class="assessment-home-logo" src="assets/brighton-logo.png" alt="Brighton English School" />
      </a>
      <p class="eyebrow">Tests</p>
      <h1 id="testsPageTitle">Choose your level</h1>
      <p id="testsPageIntro" class="assessment-home-intro">Select a CEFR level to continue to the available unit ranges.</p>
    </header>

    <section id="levelMenu" class="test-level-grid" aria-label="CEFR test levels">
      <button class="test-level-button level-a1" type="button" data-level="A1" aria-label="Choose A1 tests"><span>A1</span></button>
      <button class="test-level-button level-a2" type="button" data-level="A2" aria-label="Choose A2 tests"><span>A2</span></button>
      <button class="test-level-button level-b1" type="button" data-level="B1" aria-label="Choose B1 tests"><span>B1</span></button>
      <button class="test-level-button level-b1plus" type="button" data-level="B1+" aria-label="Choose B1 plus tests"><span>B1+</span></button>
      <button class="test-level-button level-b2" type="button" data-level="B2" aria-label="Choose B2 tests"><span>B2</span></button>
      <button class="test-level-button level-c1" type="button" data-level="C1" aria-label="Choose C1 tests"><span>C1</span></button>
    </section>

    <section id="unitMenu" class="unit-submenu" aria-label="Test unit ranges" hidden>
      <div class="unit-submenu-head">
        <button id="backToLevels" class="unit-back-button" type="button" aria-label="Back to test levels">
          <span aria-hidden="true">←</span> Back to levels
        </button>
        <div>
          <p id="selectedLevelLabel" class="eyebrow">A1 level</p>
          <h2>Available tests</h2>
        </div>
      </div>

      <div id="unitTestGrid" class="unit-option-grid unit-test-grid" aria-live="polite">
        <article class="unit-test-card" data-units="1-2"></article>
        <article class="unit-test-card" data-units="1-4"></article>
        <article class="unit-test-card" data-units="5-6"></article>
        <article class="unit-test-card" data-units="5-7"></article>
        <article class="unit-test-card" data-units="9-10"></article>
        <article class="unit-test-card" data-units="9-12"></article>
      </div>
    </section>

    <nav class="tests-home-actions" aria-label="Assessment navigation">
      <a class="primary-btn" href="test-results.html">Tests Results</a>
      <a class="secondary-btn" href="index.html">Back to Home</a>
      <a class="secondary-btn" href="teacher.html">Open Exams</a>
    </nav>

    <footer class="assessment-home-footer">Brighton English School · Digital Assessment Platform</footer>
  </main>

  <div id="testToast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="tests.js"></script>
</body>
</html>
