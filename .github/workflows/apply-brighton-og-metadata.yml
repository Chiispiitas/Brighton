name: Apply Brighton OG Metadata

on:
  push:
    paths:
      - ".github/workflows/apply-brighton-og-metadata.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update titles and social metadata
        shell: python
        run: |
          from pathlib import Path
          import re

          DESCRIPTION = "Be Brighter, Be Brighton!"
          OG_IMAGE = "https://chiispiitas.github.io/Brighton/Exams/assets/og.png"

          ROOT_TITLES = {
              "Exams/index.html": "Exams",
              "Exams/teacher.html": "Exams",
              "Exams/results.html": "Exam Results",
              "Exams/tests.html": "Tests",
              "Exams/test-results.html": "Test Results",
              "Placement/index.html": "Placement Test",
              "Placement/results.html": "Placement Test Results",
          }

          def pretty_level(raw):
              return raw.upper().replace("B1PLUS", "B1+")

          def title_for(path):
              p = path.as_posix()
              if p in ROOT_TITLES:
                  return ROOT_TITLES[p]

              parts = path.parts

              if len(parts) >= 4 and parts[0] == "Exams" and parts[1] == "exams":
                  slug = parts[2]
                  bits = slug.split("-")
                  level = pretty_level(bits[0])
                  skill = "-".join(bits[1:])
                  skill_names = {
                      "listening": "Listening",
                      "reading": "Reading",
                      "writing": "Writing",
                      "rw": "Reading",
                      "rue": "Reading",
                  }
                  return f"{level} {skill_names.get(skill, skill.replace('-', ' ').title())}"

              if len(parts) >= 4 and parts[0] == "Exams" and parts[1] == "tests":
                  slug = parts[2]
                  match = re.fullmatch(r"(a1|a2|b1|b1plus|b2)-units-(\d+)-(\d+)", slug, re.I)
                  if match:
                      level = pretty_level(match.group(1))
                      return f"{level} Units {match.group(2)}–{match.group(3)}"

              return None

          def strip_meta(html, selector):
              patterns = {
                  "description": r'\s*<meta\s+[^>]*name=["\']description["\'][^>]*>\s*',
                  "og": r'\s*<meta\s+[^>]*property=["\']og:(?:title|description|image|type)["\'][^>]*>\s*',
                  "twitter": r'\s*<meta\s+[^>]*name=["\']twitter:(?:card|title|description|image)["\'][^>]*>\s*',
              }
              return re.sub(patterns[selector], "\n", html, flags=re.I)

          targets = sorted(list(Path("Exams").rglob("*.html")) + list(Path("Placement").rglob("*.html")))
          changed = []

          for path in targets:
              title = title_for(path)
              if not title:
                  raise RuntimeError(f"No title mapping for {path}")

              html = path.read_text(encoding="utf-8")

              html = strip_meta(html, "description")
              html = strip_meta(html, "og")
              html = strip_meta(html, "twitter")

              if re.search(r"<title>[\s\S]*?</title>", html, flags=re.I):
                  html = re.sub(
                      r"<title>[\s\S]*?</title>",
                      f"<title>{title}</title>",
                      html,
                      count=1,
                      flags=re.I,
                  )
              else:
                  html = html.replace("<head>", f"<head>\n  <title>{title}</title>", 1)

              meta = (
                  f'\n  <meta name="description" content="{DESCRIPTION}" />'
                  f'\n  <meta property="og:type" content="website" />'
                  f'\n  <meta property="og:title" content="{title}" />'
                  f'\n  <meta property="og:description" content="{DESCRIPTION}" />'
                  f'\n  <meta property="og:image" content="{OG_IMAGE}" />'
                  f'\n  <meta name="twitter:card" content="summary_large_image" />'
                  f'\n  <meta name="twitter:title" content="{title}" />'
                  f'\n  <meta name="twitter:description" content="{DESCRIPTION}" />'
                  f'\n  <meta name="twitter:image" content="{OG_IMAGE}" />'
              )

              html = re.sub(
                  r"(</title>)",
                  r"\1" + meta,
                  html,
                  count=1,
                  flags=re.I,
              )

              path.write_text(html, encoding="utf-8")
              changed.append(str(path))

          print(f"Updated {len(changed)} HTML pages")
          for item in changed:
              print(item)

      - name: Commit metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Exams Placement
          if git diff --cached --quiet; then
            echo "No metadata changes required."
            exit 0
          fi
          git commit -m "Configure Brighton OG metadata and page titles"
          git push
