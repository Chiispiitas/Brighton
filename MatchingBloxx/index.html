<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123747">
  <title>Matching Bloxx · Brighton Games</title>
  <meta name="description" content="Match English collocations, drop the floors and build your tower. Play solo or join a live classroom game with up to 36 builders.">
  <link rel="canonical" href="https://exams.bebrighton.net/MatchingBloxx/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Matching Bloxx">
  <meta property="og:description" content="Match the words and stack your tower. A free classroom game for up to 36 builders.">
  <meta property="og:url" content="https://exams.bebrighton.net/MatchingBloxx/">
  <meta property="og:image" content="https://exams.bebrighton.net/MatchingBloxx/assets/share.png">
  <meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" href="style.css?v=2">
  <script defer src="config.js"></script>
  <script defer src="rules.js"></script>
  <script defer src="lib/qrcode.min.js"></script>
  <script defer src="scene.js?v=2"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="topbar"><div class="bar-inner">
    <div class="brand"><img src="assets/icon.png" width="36" height="36" alt=""><span>Brighton Games</span></div>
    <nav aria-label="Game options"><button id="help" class="top-button"><span class="book-icon" aria-hidden="true">?</span>How to play</button><button id="audio" class="top-button" aria-pressed="true"><span class="speaker" aria-hidden="true">♪</span><span id="audio-label">Sound on</span></button></nav>
  </div></header>
  <main id="game" class="shell">
    <section id="art" class="art-frame" aria-label="Tower construction site">
      <header id="marquee" class="marquee"><h1><img src="assets/wordmark.png" width="490" height="150" alt="Matching Bloxx"></h1></header>
      <div id="scene" class="scene"></div>
      <div id="crane-label" class="crane-label" hidden></div>
      <div class="art-foot"><span id="mode"><i class="lamp" aria-hidden="true"></i> English collocations</span><span id="counter">12 rounds</span></div>
    </section>
    <section id="desk" class="desk" aria-label="Game controls"><div id="panel"></div><p id="feedback" class="feedback" role="status" hidden></p></section>
  </main>
  <div id="overlay" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div id="dialog-body"></div><button id="close-dialog" type="button" class="button yellow">Back to game</button></section></div>
  <noscript><p class="noscript">Turn on JavaScript to play Matching Bloxx.</p></noscript>
</body>
</html>
