<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Articulated Horizons companions</title><style>@font-face{font-family:Horizons;src:url('../assets/fonts/MPLUSRounded1c-Regular.woff2')}body{margin:0;padding:24px;background:#fffdfa;font:16px Horizons,sans-serif;color:#19475c}h1{font-size:26px}.proof-grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:20px}.pose{height:360px;background:#fff3df;border-radius:24px}.pose>.character{position:relative;display:block;width:100%;height:100%;animation:none!important}.label{text-align:center;margin:8px 0}button{font:inherit;border:0;border-radius:20px;background:#ac1763;color:white;padding:8px 18px;cursor:pointer}.cell{text-align:center}@media(max-width:800px){.proof-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pose{height:300px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><h1>Horizons companions in motion</h1><p><a href="../?v=flat1">Open Horizons</a></p><div class="proof-grid" id="proof"></div><script type="module">import{loadArt,characterMarkup,refreshCharacterMotion}from'../src/art.js?v=flat1';await loadArt();const rows=[['welcome-pico','welcome-mina','welcome-alex','welcome-jo'],['question-pico','lesson-guide lesson-guide-1c','practice-alex','aside-jo'],['hero-pico','question-mina','lesson-guide lesson-guide-1d','question-jo'],['result-pico','game-mina','game-alex','goal-jo']];for(const row of rows)for(const [i,name]of ['pico','mina','alex','jo'].entries()){const cell=document.createElement('section');cell.className='cell';cell.innerHTML=`<div class="pose">${characterMarkup(name,row[i],row[i].includes('result-')?'celebrate':'idle')}</div><p class="label">${name[0].toUpperCase()+name.slice(1)}</p><button>Say hello</button>`;cell.querySelector('button').addEventListener('click',()=>cell.querySelector('.character').__articulatedRig?.setMood('wave'));document.getElementById('proof').append(cell);}refreshCharacterMotion(document.getElementById('proof'));</script></html>
