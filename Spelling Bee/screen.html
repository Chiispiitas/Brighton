<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spelling Bee · Screen View</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="screen.css?v=20261017-preview16">
</head>
<body>
  <main class="broadcast" id="broadcast" aria-label="Spelling Bee audience display">
    <video class="camera-feed hidden" id="camera-feed" autoplay playsinline muted aria-hidden="true"></video>
    <img class="camera-still hidden" id="camera-still" alt="Occasional camera preview">
    <div class="camera-shade" aria-hidden="true"></div>
    <div class="arena" aria-hidden="true"></div>
    <header class="broadcast-header">
      <div class="school-brand"><img src="assets/logo.png" alt="Lev-Vigotsky school logo"><strong>U.E.P LEV VIGOTSKY MANTA</strong></div>
      <div class="broadcast-event"><div class="event-bug"><span>Spelling Bee</span><strong id="round-bug"></strong></div><img class="english-brand" src="assets/english-logo.png" alt="Lev Vigotsky English Area logo"></div>
    </header>
    <section class="scene" id="scene" aria-live="polite"></section>
    <footer class="broadcast-footer"><span id="footer-copy"></span></footer>
    <div class="logo-sweep" id="logo-sweep" aria-hidden="true"><div class="sweep-panel"><img src="assets/logo.png" alt=""></div></div>
    <div class="signal hidden" id="signal" role="status">Reconnecting · last scene held</div>
  </main>
  <form class="screen-join hidden" id="screen-join">
    <img src="assets/logo.png" alt="Lev-Vigotsky school logo">
    <h1>Screen View</h1><p>Enter the same session code used in Admin View.</p>
    <label for="screen-code">Session code</label><input id="screen-code" inputmode="numeric" autocomplete="off" required>
    <button type="submit">Connect screen</button><p id="join-error" role="status"></p>
    <a href="screen.html?demo=1">Preview all scenes</a>
  </form>
  <button class="fullscreen" id="fullscreen" type="button">⛶ Full screen · F</button>
  <button class="camera-toggle hidden" id="camera-toggle" type="button">Camera · C</button>
  <aside class="camera-setup hidden" id="camera-setup" aria-label="Camera setup">
    <h2>Broadcast camera</h2>
    <label>Camera<select id="camera-device"><option value="">Default camera</option></select></label>
    <label class="camera-mirror-label"><input id="camera-mirror" type="checkbox">Mirror camera</label>
    <p id="camera-status" role="status">Start the camera on this Screen View computer. Admin receives a low-quality still about every 15 seconds.</p>
    <div><button id="camera-start" type="button">Start camera</button><button id="camera-stop" type="button" disabled>Stop camera</button><button id="camera-close" type="button">Hide controls</button></div>
  </aside>
  <script src="js/cloud.js?v=20261015-stress6"></script>
  <script src="js/screen-model.js?v=20261017-preview16"></script>
  <script src="js/screen-camera.js?v=20261017-preview16"></script>
  <script src="js/screen-view.js?v=20261017-preview16"></script>
</body>
</html>
