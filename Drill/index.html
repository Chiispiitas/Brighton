<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="A timed arithmetic practice page.">
  <meta name="theme-color" content="#efefe7">
  <title>Arithmetic practice</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script defer src="questions.js?v=3"></script>
  <script defer src="app.js?v=4"></script>
</head>
<body>
  <main class="shell">
    <header class="top">
      <button id="exit" class="quiet" type="button" hidden>← Setup</button>
    </header>
    <form id="setup" class="screen setup">
      <fieldset>
        <legend>Operation</legend>
        <div class="operations">
          <label><input type="checkbox" name="operation" value="add" checked><span><b>+</b> Addition</span></label>
          <label><input type="checkbox" name="operation" value="subtract" checked><span><b>−</b> Subtraction</span></label>
          <label><input type="checkbox" name="operation" value="multiply" checked><span><b>×</b> Multiplication</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Number range</legend>
        <div class="range">
          <label>From<input id="from" type="number" min="0" max="999" value="1" required></label>
          <label>To<input id="to" type="number" min="0" max="999" value="100" required></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Questions</legend>
        <div class="counts">
          <label><input type="radio" name="count" value="10"><span>10</span></label>
          <label><input type="radio" name="count" value="20" checked><span>20</span></label>
          <label><input type="radio" name="count" value="30"><span>30</span></label>
        </div>
      </fieldset>
      <p id="setup-error" class="error" role="alert" hidden></p>
      <button class="primary start" type="submit">Start <span aria-hidden="true">→</span></button>
    </form>
    <section id="game" class="screen game" aria-label="Practice round" hidden>
      <div class="game-top">
        <span id="progress"></span>
        <time id="timer" aria-label="Elapsed time">0:00.0</time>
      </div>
      <div id="track" class="track" aria-hidden="true"></div>
      <div class="question">
        <p id="expression" aria-live="polite" aria-atomic="true"></p>
        <form id="entry" class="entry" autocomplete="off">
          <label class="visually-hidden" for="answer">Answer</label>
          <input id="answer" type="text" inputmode="none" pattern="[0-9]*" spellcheck="false" placeholder="?" maxlength="4" aria-describedby="feedback">
        </form>
        <p id="feedback" role="status"></p>
      </div>
      <div id="pad" class="pad" aria-label="Number keypad">
        <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
        <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
        <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
        <button type="button" data-key="erase" aria-label="Backspace">⌫</button><button type="button" data-key="0">0</button><button type="button" data-key="enter" aria-label="Check answer">↵</button>
      </div>
    </section>
    <section id="results" class="screen results" aria-labelledby="result-heading" hidden>
      <h1 id="result-heading" tabindex="-1">Finished</h1>
      <p class="result-time" id="result-time"></p>
      <dl>
        <div><dt>Solved</dt><dd id="solved"></dd></div>
        <div><dt>Misses</dt><dd id="misses"></dd></div>
        <div><dt>Per question</dt><dd id="pace"></dd></div>
      </dl>
      <p id="best" class="best" hidden></p>
      <button class="primary" id="again" type="button">Go again <span aria-hidden="true">→</span></button>
    </section>
  </main>
</body>
</html>
